name: Diagnóstico das ofertas públicas (sem dados pessoais)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnosticar-ofertas-publicas.cjs'
      - '.github/workflows/diagnostico-ofertas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnosticar somente números agregados de ofertas públicas
        run: node scripts/diagnosticar-ofertas-publicas.cjs
